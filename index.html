<!doctype html>
<html lang="en">
  <head>
    <!--
      Easylife Planner — single-file React planner.

      Main features: task dashboard, weekly routine board, calendar, statistics,
      dark mode, and Firebase email/password authentication with Firestore sync.

      The React application starts in the script at the end of <body>:
      - firebaseConfig and firebaseReady connect Firebase Authentication + Firestore.
      - App stores tasks/routine data, loads the signed-in user's cloud data,
        and saves changes to users/{userId}/planner/main.
      - Dashboard, Calendar, Statistics, and Settings are the main views.

      Setup reminder: enable Email/Password in Firebase Authentication and create
      Cloud Firestore with security rules that limit each user to their own data.
    -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Easylife Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            boxShadow: { soft: '0 12px 35px rgba(31, 45, 61, .08)' },
            colors: { ink: '#202B3D', cloud: '#F6F7FB', brand: '#5367F3' }
          }
        }
      }
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body { background: #F6F7FB; color: #202B3D; }
      * { box-sizing: border-box; }
      .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
      .scrollbar-thin::-webkit-scrollbar-thumb { background: #d9ddea; border-radius: 999px; }
      .dark { color-scheme: dark; }
      .dark, .dark body { background: #111827; color: #e5e7eb; }
      .dark .bg-cloud { background-color: #111827; }
      .dark .bg-white { background-color: #1f2937; }
      .dark .bg-slate-50, .dark .bg-slate-50\/60 { background-color: #273449; }
      .dark .bg-slate-100 { background-color: #334155; }
      .dark .bg-indigo-50, .dark .bg-indigo-50\/60 { background-color: #292a57; }
      .dark .bg-emerald-50 { background-color: #123d38; }
      .dark .bg-amber-50 { background-color: #4a3515; }
      .dark .bg-rose-50 { background-color: #4b2633; }
      .dark .text-ink, .dark .text-slate-700 { color: #f1f5f9; }
      .dark .text-slate-600 { color: #cbd5e1; }
      .dark .text-slate-500 { color: #b6c2d2; }
      .dark .text-slate-400 { color: #94a3b8; }
      .dark .text-slate-300 { color: #64748b; }
      .dark .border-slate-50, .dark .border-slate-100, .dark .border-slate-200 { border-color: #334155; }
      .dark .border-slate-300 { border-color: #64748b; }
      .dark .hover\:bg-slate-50:hover { background-color: #334155; }
      .dark .hover\:text-slate-700:hover { color: #f8fafc; }
      .dark input, .dark textarea, .dark select { color: #e5e7eb; }
      .dark select option { background: #1f2937; }
      .dark .scrollbar-thin::-webkit-scrollbar-thumb { background: #475569; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      // Get React tools used to store data and run code when the app changes.
      const { useEffect, useMemo, useRef, useState } = React;

      // Firebase project details. These identify the Easylife Planner Firebase project.
      // They are used by the browser to connect to Firebase Authentication and Firestore.
      const firebaseConfig = {
        apiKey: 'AIzaSyCWhRyeUCzOTxsg7W7Zw6hXUdaPZx8MnMk',
        authDomain: 'easylife-planner.firebaseapp.com',
        projectId: 'easylife-planner',
        storageBucket: 'easylife-planner.firebasestorage.app',
        messagingSenderId: '190948026697',
        appId: '1:190948026697:web:96c752af2cd9cb97d0d298'
      };

      // Load only the Firebase features this planner needs:
      // - firebase-app: starts the Firebase connection
      // - firebase-auth: login, sign-up, and logout
      // - firebase-firestore: cloud storage for tasks and weekly routines
      const firebaseReady = Promise.all([
        import('https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js'),
        import('https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js'),
        import('https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js')
      ]).then(([appSdk, authSdk, firestoreSdk]) => {
        // Start Firebase with this project's configuration.
        const app = appSdk.initializeApp(firebaseConfig);
        // Return the authentication connection and Firebase functions for use in App.
        return { auth: authSdk.getAuth(app), ...authSdk, ...firestoreSdk };
      }).catch(error => {
        // Keep the planner usable with browser storage if Firebase cannot connect.
        console.error('Firebase could not start.', error);
        return null;
      });

      const initialTasks = [
        { id: 1, name: 'Read Biology chapter 4', priority: 'High', due: '2026-08-28', done: false, category: 'Study', description: 'Review cell division, then write a one-page summary.', subtasks: [{ id: 11, title: 'Read pages 84–102', done: true }, { id: 12, title: 'Make flashcards', done: false }] },
        { id: 2, name: 'Prepare project presentation', priority: 'High', due: '2026-08-30', done: false, category: 'Work', description: 'Prepare the first draft of slides and check all numbers.', subtasks: [{ id: 21, title: 'Outline key points', done: true }, { id: 22, title: 'Build slides', done: false }] },
        { id: 3, name: 'Physics problem set', priority: 'Medium', due: '2026-08-29', done: false, category: 'Study', description: 'Complete questions 1–12 before Friday evening.', subtasks: [] },
        { id: 4, name: 'Reply to study group', priority: 'Low', due: '2026-08-27', done: true, category: 'Personal', description: 'Confirm the time for the next group revision session.', subtasks: [] }
      ];

      const initialRoutine = {
        Mon: [{id: 'mon-1', title: 'Biology · 09:00', details: 'Review this week’s chapter notes.', done: false}, {id: 'mon-2', title: 'Workout · 17:30', details: '', done: false}], Tue: [{id: 'tue-1', title: 'Physics · 10:00', details: '', done: false}], Wed: [{id: 'wed-1', title: 'Project work · 14:00', details: '', done: false}],
        Thu: [{id: 'thu-1', title: 'Math revision · 09:30', details: '', done: false}], Fri: [{id: 'fri-1', title: 'Biology lab · 13:00', details: '', done: false}], Sat: [{id: 'sat-1', title: 'Weekly review · 10:00', details: '', done: false}], Sun: [{id: 'sun-1', title: 'Plan next week · 18:00', details: '', done: false}]
      };
      const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
      const dayLong = { Mon: 'Monday', Tue: 'Tuesday', Wed: 'Wednesday', Thu: 'Thursday', Fri: 'Friday', Sat: 'Saturday', Sun: 'Sunday' };
      const normalizeRoutine = (saved) => Object.fromEntries(days.map(day => [day, (saved?.[day] || initialRoutine[day]).map((item, index) => typeof item === 'string' ? { id: `${day}-${index}-${item}`, title: item, details: '', done: false } : { ...item, details: item.details || '', done: Boolean(item.done) })]));

      function Icon({ name, size = 18, stroke = 2 }) {
        const paths = {
          grid: <><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></>,
          calendar: <><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></>,
          chart: <><path d="M4 19V5M4 19h17"/><path d="m7 15 4-5 3 3 6-7"/></>,
          settings: <><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.1 2.1-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.55V20h-3v-.09A1.7 1.7 0 0 0 10.7 18.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.1-2.1.06-.06A1.7 1.7 0 0 0 7.06 15 1.7 1.7 0 0 0 5.5 14H5v-3h.09A1.7 1.7 0 0 0 6.6 10a1.7 1.7 0 0 0-.34-1.88L6.2 8.06l2.1-2.1.06.06A1.7 1.7 0 0 0 10.24 6.36 1.7 1.7 0 0 0 11.27 4.8V4h3v.09a1.7 1.7 0 0 0 1.03 1.55 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.1 2.1-.06.06A1.7 1.7 0 0 0 18.94 10 1.7 1.7 0 0 0 20.5 11h.5v3h-.09A1.7 1.7 0 0 0 19.4 15Z"/></>,
          plus: <path d="M12 5v14M5 12h14"/>, close: <path d="m6 6 12 12M18 6 6 18"/>, check: <path d="m5 12 4 4L19 6"/>, chevron: <path d="m9 18 6-6-6-6"/>, bell: <><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></>, search: <><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></>, dots: <><circle cx="5" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="19" cy="12" r="1" fill="currentColor"/></>
        };
        return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round">{paths[name]}</svg>
      }

      function Badge({ priority }) {
        const styles = { High: 'bg-rose-50 text-rose-600 ring-rose-100', Medium: 'bg-amber-50 text-amber-600 ring-amber-100', Low: 'bg-emerald-50 text-emerald-600 ring-emerald-100' };
        return <span className={'rounded-full px-2.5 py-1 text-[11px] font-bold ring-1 ' + styles[priority]}>{priority}</span>;
      }

      function App() {
        const [page, setPage] = useState('Dashboard');
        const [tasks, setTasks] = useState(initialTasks);
        const [routine, setRoutine] = useState(initialRoutine);
        const [selectedId, setSelectedId] = useState(null);
        const [search, setSearch] = useState('');
        const [showNewTask, setShowNewTask] = useState(false);
        const [routinePanel, setRoutinePanel] = useState(null);
        const [showAuth, setShowAuth] = useState(false);
        const [firebase, setFirebase] = useState(null);
        const [user, setUser] = useState(null);
        const [plannerReady, setPlannerReady] = useState(false);
        const [authError, setAuthError] = useState('');
        const applyingRemoteData = useRef(false);
        const [darkMode, setDarkMode] = useState(() => localStorage.getItem('easylife-theme') === 'dark');
        const [newTask, setNewTask] = useState({ name: '', priority: 'Medium', due: '2026-08-30', category: 'Study' });
        const selectedTask = tasks.find(task => task.id === selectedId);
        // Show the Firebase username when available; existing accounts fall back to their email prefix.
        const displayName = user?.displayName || user?.email?.split('@')[0] || 'Guest';
        const avatarLetter = displayName.charAt(0).toUpperCase();
        const completed = tasks.filter(task => task.done).length;
        const percentage = tasks.length ? Math.round((completed / tasks.length) * 100) : 0;
        const visibleTasks = tasks.filter(task => task.name.toLowerCase().includes(search.toLowerCase()));

        useEffect(() => {
          // Listen for account changes, then subscribe to that account's planner document.
          let unsubscribeAuth;
          let unsubscribePlanner;
          firebaseReady.then(services => {
            if (!services) { setPlannerReady(true); return; }
            setFirebase(services);
            const db = services.getFirestore();
            unsubscribeAuth = services.onAuthStateChanged(services.auth, currentUser => {
              if (unsubscribePlanner) unsubscribePlanner();
              setPlannerReady(false);
              setUser(currentUser);
              if (!currentUser) {
                applyingRemoteData.current = true;
                setTasks(initialTasks);
                setRoutine(initialRoutine);
                setPlannerReady(true);
                return;
              }
              // onSnapshot keeps this page updated when data changes on another device or tab.
              const plannerRef = services.doc(db, 'users', currentUser.uid, 'planner', 'main');
              unsubscribePlanner = services.onSnapshot(plannerRef, snapshot => {
                if (snapshot.exists()) {
                  const saved = snapshot.data();
                  applyingRemoteData.current = true;
                  setTasks(saved.tasks || initialTasks);
                  setRoutine(normalizeRoutine(saved.routine));
                } else {
                  // First-time account: create an empty starter planner document.
                  services.setDoc(plannerRef, { tasks: initialTasks, routine: initialRoutine, updatedAt: services.serverTimestamp() });
                }
                setPlannerReady(true);
              }, () => { setAuthError('Your account is signed in, but planner data could not be loaded. Check Firestore setup and rules.'); setPlannerReady(true); });
            });
          });
          return () => { if (unsubscribeAuth) unsubscribeAuth(); if (unsubscribePlanner) unsubscribePlanner(); };
        }, []);
        useEffect(() => {
          if (!firebase || !user || !plannerReady) return;
          // Do not write again when this state change came from Firestore itself.
          if (applyingRemoteData.current) { applyingRemoteData.current = false; return; }
          const plannerRef = firebase.doc(firebase.getFirestore(), 'users', user.uid, 'planner', 'main');
          // Save edits to the existing document; setDoc is the fallback for a new document.
          firebase.updateDoc(plannerRef, { tasks, routine, updatedAt: firebase.serverTimestamp() }).catch(() => firebase.setDoc(plannerRef, { tasks, routine, updatedAt: firebase.serverTimestamp() }).catch(() => setAuthError('Changes could not sync to Firestore.')));
        }, [tasks, routine, firebase, user, plannerReady]);
        useEffect(() => {
          localStorage.setItem('easylife-theme', darkMode ? 'dark' : 'light');
          document.documentElement.classList.toggle('dark', darkMode);
        }, [darkMode]);

        const updateTask = (id, changes) => setTasks(current => current.map(task => task.id === id ? { ...task, ...changes } : task));
        const addTask = (event) => {
          event.preventDefault();
          if (!newTask.name.trim()) return;
          const task = { ...newTask, id: Date.now(), name: newTask.name.trim(), done: false, description: '', subtasks: [] };
          setTasks(current => [task, ...current]);
          setNewTask({ name: '', priority: 'Medium', due: '2026-08-30', category: 'Study' });
          setShowNewTask(false);
          setSelectedId(task.id);
        };
        const openNewTaskForDate = (due) => {
          setNewTask({ name: '', priority: 'Medium', due, category: 'Study' });
          setShowNewTask(true);
        };
        const authenticate = async (mode, email, password, username) => {
          setAuthError('');
          if (!firebase) { setAuthError('Firebase is still connecting. Please try again in a moment.'); return; }
          try {
            if (mode === 'signup') {
              const credential = await firebase.createUserWithEmailAndPassword(firebase.auth, email, password);
              if (username.trim()) {
                await firebase.updateProfile(credential.user, { displayName: username.trim() });
                setUser({ ...credential.user, displayName: username.trim() });
              }
            } else await firebase.signInWithEmailAndPassword(firebase.auth, email, password);
            setShowAuth(false);
          } catch (error) {
            const messages = { 'auth/email-already-in-use': 'This email already has an account.', 'auth/invalid-email': 'Enter a valid email address.', 'auth/weak-password': 'Use a password with at least 6 characters.', 'auth/invalid-credential': 'Email or password is incorrect.' };
            setAuthError(messages[error.code] || 'Authentication failed. Please check Firebase Authentication is enabled.');
          }
        };
        const signOut = async () => { if (firebase) await firebase.signOut(firebase.auth); };
        const deleteTask = task => {
          setTasks(current => current.filter(item => item.id !== task.id));
          setSelectedId(null);
        };
        const saveRoutine = (day, item, isNew) => setRoutine(current => ({ ...current, [day]: isNew ? [...current[day], item] : current[day].map(existing => existing.id === item.id ? item : existing) }));
        const toggleRoutine = (day, id) => setRoutine(current => ({ ...current, [day]: current[day].map(item => item.id === id ? { ...item, done: !item.done } : item) }));

        return <div className="min-h-screen bg-cloud font-sans text-ink">
          <div className="flex min-h-screen">
            <aside className="hidden w-[248px] shrink-0 flex-col border-r border-slate-100 bg-white px-5 py-7 lg:flex">
              <div className="mb-12 flex items-center gap-3 px-2">
                <div className="grid h-10 w-10 place-items-center rounded-xl bg-brand text-xl font-black text-white shadow-lg shadow-indigo-200">E</div>
                <div><h1 className="text-[17px] font-extrabold tracking-tight">Easylife</h1><p className="text-xs text-slate-400">Planner</p></div>
              </div>
              <nav className="space-y-1">
                {[['Dashboard','grid'],['Calendar','calendar'],['Statistics','chart'],['Settings','settings']].map(([label, icon]) => <button key={label} onClick={() => setPage(label)} className={'flex w-full items-center gap-3 rounded-xl px-3 py-3 text-sm font-semibold transition ' + (page === label ? 'bg-indigo-50 text-brand' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-700')}><Icon name={icon}/>{label}</button>)}
              </nav>
              <div className="mt-auto rounded-2xl bg-gradient-to-br from-indigo-500 to-brand p-4 text-white shadow-lg shadow-indigo-100">
                <p className="text-xs font-medium text-indigo-100">This week</p><p className="mt-1 text-2xl font-bold">{percentage}% <span className="text-sm font-medium">done</span></p><div className="mt-3 h-1.5 overflow-hidden rounded-full bg-white/25"><div className="h-full rounded-full bg-white" style={{width: percentage + '%'}} /></div>
                <p className="mt-3 text-[11px] leading-relaxed text-indigo-100">Small steps still move you forward.</p>
              </div>
              <div className="mt-6 flex items-center gap-3 px-2"><div className="grid h-9 w-9 place-items-center rounded-full bg-orange-100 text-sm font-bold text-orange-600">{avatarLetter}</div><div><p className="text-sm font-bold">{displayName}</p><p className="text-[11px] text-slate-400">{user ? 'Free plan' : 'Sign in to sync'}</p></div><Icon name="dots" size={18}/></div>
            </aside>

            <main className="min-w-0 flex-1 overflow-hidden">
              <header className="flex h-[88px] items-center justify-between bg-cloud px-5 sm:px-8 lg:px-10">
                <div><p className="text-xs font-semibold uppercase tracking-[.16em] text-brand">{page === 'Dashboard' ? 'Thursday, August 28' : 'Easylife Planner'}</p><h2 className="mt-1 text-2xl font-extrabold tracking-tight sm:text-[28px]">{page === 'Dashboard' ? (user ? `Good morning, ${displayName}!` : 'Welcome to Easylife!') : page}</h2></div>
                <div className="flex items-center gap-3"><button onClick={() => setDarkMode(current => !current)} aria-label={darkMode ? 'Switch to light mode' : 'Switch to dark mode'} title={darkMode ? 'Switch to light mode' : 'Switch to dark mode'} className="rounded-xl bg-white p-2.5 text-slate-500 shadow-sm transition hover:text-brand"><span className="text-base leading-none">{darkMode ? '☀︎' : '☾'}</span></button>{user ? <div className="hidden items-center gap-2 sm:flex"><span title={user.email} className="max-w-28 truncate text-xs font-bold text-slate-500">{user.email}</span><button onClick={signOut} className="rounded-xl bg-white px-3 py-2.5 text-xs font-bold text-slate-500 shadow-sm transition hover:text-brand">Log out</button></div> : <button onClick={() => setShowAuth(true)} className="rounded-xl bg-white px-3 py-2.5 text-xs font-bold text-brand shadow-sm transition hover:bg-indigo-50">Log in</button>}<button onClick={() => setShowNewTask(true)} className="flex items-center gap-2 rounded-xl bg-brand px-3.5 py-2.5 text-sm font-bold text-white shadow-lg shadow-indigo-200 transition hover:bg-indigo-600"><Icon name="plus" size={17}/><span className="hidden sm:inline">Add task</span></button></div>
              </header>
              <div className="scrollbar-thin h-[calc(100vh-88px)] overflow-y-auto px-5 pb-8 sm:px-8 lg:px-10">
                {page === 'Dashboard' && <Dashboard routine={routine} tasks={visibleTasks} allTasks={tasks} search={search} setSearch={setSearch} openRoutine={setRoutinePanel} toggleRoutine={toggleRoutine} setSelectedId={setSelectedId} updateTask={updateTask} />}
                {page === 'Calendar' && <Calendar tasks={tasks} setSelectedId={setSelectedId} addTaskForDate={openNewTaskForDate} />}
                {page === 'Statistics' && <Statistics tasks={tasks} routine={routine} />}
                {page === 'Settings' && <Settings darkMode={darkMode} setDarkMode={setDarkMode} user={user} displayName={displayName} avatarLetter={avatarLetter} />}
              </div>
            </main>
          </div>
          <MobileNav page={page} setPage={setPage} />
          <TaskPanel task={selectedTask} close={() => setSelectedId(null)} updateTask={updateTask} deleteTask={deleteTask} />
          {routinePanel && <RoutinePanel key={routinePanel.day + routinePanel.item.id} entry={routinePanel} close={() => setRoutinePanel(null)} saveRoutine={saveRoutine} />}
          {showNewTask && <NewTaskModal task={newTask} setTask={setNewTask} close={() => setShowNewTask(false)} save={addTask} />}
          {showAuth && <AuthModal close={() => { setShowAuth(false); setAuthError(''); }} authenticate={authenticate} error={authError} />}
        </div>;
      }

      function Dashboard({ routine, tasks, allTasks, search, setSearch, openRoutine, toggleRoutine, setSelectedId, updateTask }) {
        const completed = allTasks.filter(task => task.done).length;
        return <>
          <section className="mb-7 grid grid-cols-1 gap-4 sm:grid-cols-3">
            <Summary label="Tasks today" value={allTasks.filter(t => t.due === '2026-08-28').length} sub="Keep the momentum going" color="bg-indigo-50 text-brand" icon="grid" />
            <Summary label="Completed" value={`${completed}/${allTasks.length}`} sub="You are making progress" color="bg-emerald-50 text-emerald-600" icon="check" />
            <Summary label="Upcoming" value={allTasks.filter(t => !t.done && t.due > '2026-08-28').length} sub="Tasks for the next days" color="bg-amber-50 text-amber-600" icon="calendar" />
          </section>
          <section className="mb-8 rounded-2xl bg-white p-5 shadow-soft sm:p-6">
            <div className="mb-5 flex items-center justify-between"><div><h3 className="font-extrabold">Weekly routine</h3><p className="mt-1 text-xs text-slate-400">A light plan for a focused week</p></div><button className="text-xs font-bold text-brand">Week 35 <span className="ml-1">⌄</span></button></div>
            <div className="scrollbar-thin overflow-x-auto pb-1"><div className="grid min-w-[760px] grid-cols-7 gap-3">{days.map((day, dayIndex) => <div key={day} className={'min-h-[176px] rounded-xl p-3 ' + (dayIndex === 3 ? 'bg-indigo-50 ring-1 ring-indigo-100' : 'bg-slate-50')}><div className="mb-3 flex items-center justify-between"><div><p className={'text-[11px] font-bold uppercase ' + (dayIndex === 3 ? 'text-brand' : 'text-slate-400')}>{day}</p><p className="text-sm font-extrabold">{25 + dayIndex}</p></div>{dayIndex === 3 && <span className="h-2 w-2 rounded-full bg-brand"/>}</div><div className="space-y-2">{routine[day].map(item => <div key={item.id} className="flex overflow-hidden rounded-lg bg-white shadow-sm transition hover:ring-1 hover:ring-indigo-200"><button aria-label={item.done ? `Mark ${item.title} incomplete` : `Mark ${item.title} complete`} onClick={() => toggleRoutine(day, item.id)} className={'m-2 grid h-4 w-4 shrink-0 place-items-center rounded border transition ' + (item.done ? 'border-brand bg-brand text-white' : 'border-slate-300 text-transparent hover:border-brand')}><Icon name="check" size={11} stroke={3}/></button><button onClick={() => openRoutine({day, item, isNew: false})} className={'min-w-0 flex-1 px-1 py-2 pr-2 text-left text-[11px] font-semibold leading-tight ' + (item.done ? 'text-slate-400 line-through' : 'text-slate-600')}>{item.title}</button></div>)}</div><button onClick={() => openRoutine({day, item: {id: Date.now(), title: '', details: '', done: false}, isNew: true})} className="mt-3 flex items-center gap-1 text-[11px] font-bold text-slate-400 transition hover:text-brand"><Icon name="plus" size={13}/> Add</button></div>)}</div></div>
          </section>
          <section className="rounded-2xl bg-white p-5 shadow-soft sm:p-6">
            <div className="mb-5 flex flex-col justify-between gap-3 sm:flex-row sm:items-center"><div><h3 className="font-extrabold">My tasks</h3><p className="mt-1 text-xs text-slate-400">Click a task to view and edit its details</p></div><label className="flex h-9 items-center gap-2 rounded-lg bg-slate-50 px-3 text-slate-400 sm:w-52"><Icon name="search" size={15}/><input value={search} onChange={e => setSearch(e.target.value)} className="w-full bg-transparent text-xs text-slate-700 outline-none placeholder:text-slate-400" placeholder="Search tasks" /></label></div>
            <div className="overflow-x-auto"><table className="w-full min-w-[600px] text-left"><thead><tr className="border-b border-slate-100 text-[11px] font-bold uppercase tracking-wider text-slate-400"><th className="w-12 pb-3">Done</th><th className="pb-3">Task name</th><th className="w-28 pb-3">Priority</th><th className="w-32 pb-3">Due date</th><th className="w-8 pb-3"></th></tr></thead><tbody>{tasks.map(task => <tr key={task.id} onClick={() => setSelectedId(task.id)} className="group cursor-pointer border-b border-slate-50 text-sm transition hover:bg-slate-50"><td className="py-3.5"><button onClick={e => { e.stopPropagation(); updateTask(task.id, {done: !task.done}); }} className={'grid h-5 w-5 place-items-center rounded-md border transition ' + (task.done ? 'border-brand bg-brand text-white' : 'border-slate-300 bg-white text-transparent hover:border-brand')}><Icon name="check" size={13} stroke={3}/></button></td><td className={'py-3.5 font-bold ' + (task.done ? 'text-slate-300 line-through' : 'text-slate-700')}>{task.name}<span className="ml-2 rounded bg-slate-100 px-1.5 py-0.5 text-[10px] font-bold text-slate-400">{task.category}</span></td><td className="py-3.5"><Badge priority={task.priority}/></td><td className="py-3.5 text-xs font-semibold text-slate-500">{task.due === '2026-08-28' ? 'Today' : task.due === '2026-08-29' ? 'Tomorrow' : new Date(task.due + 'T00:00').toLocaleDateString('en-US', {month:'short', day:'numeric'})}</td><td className="py-3.5 text-slate-300 group-hover:text-slate-500"><Icon name="chevron" size={16}/></td></tr>)}</tbody></table></div>
          </section>
        </>;
      }

      function Summary({ label, value, sub, color, icon }) { return <div className="flex items-center gap-4 rounded-2xl bg-white p-4 shadow-soft"><div className={'grid h-11 w-11 place-items-center rounded-xl ' + color}><Icon name={icon} size={20}/></div><div><p className="text-xl font-extrabold">{value}</p><p className="text-xs font-bold text-slate-600">{label}</p><p className="mt-0.5 text-[10px] text-slate-400">{sub}</p></div></div>; }
      function MobileNav({ page, setPage }) { return <nav className="fixed inset-x-0 bottom-0 z-20 flex justify-around border-t border-slate-100 bg-white py-2 lg:hidden">{[['Dashboard','grid'],['Calendar','calendar'],['Statistics','chart'],['Settings','settings']].map(([label, icon]) => <button key={label} onClick={() => setPage(label)} className={'grid justify-items-center gap-1 px-2 text-[10px] font-bold ' + (page === label ? 'text-brand' : 'text-slate-400')}><Icon name={icon} size={18}/>{label}</button>)}</nav>; }
      function TaskPanel({ task, close, updateTask, deleteTask }) {
        const [subtask, setSubtask] = useState('');
        if (!task) return <div className="pointer-events-none fixed inset-y-0 right-0 z-30 w-full max-w-[390px] translate-x-full bg-white transition-transform"/>;
        const addSubtask = e => { e.preventDefault(); if (!subtask.trim()) return; updateTask(task.id, { subtasks: [...task.subtasks, {id: Date.now(), title: subtask.trim(), done: false}] }); setSubtask(''); };
        const toggleSubtask = id => updateTask(task.id, { subtasks: task.subtasks.map(item => item.id === id ? {...item, done: !item.done} : item) });
        return <><div onClick={close} className="fixed inset-0 z-30 bg-slate-900/20 backdrop-blur-[1px]"/><aside className="scrollbar-thin fixed inset-y-0 right-0 z-40 w-full max-w-[390px] overflow-y-auto bg-white p-6 shadow-2xl transition-transform duration-300"><div className="mb-7 flex items-center justify-between"><span className="rounded-full bg-indigo-50 px-2.5 py-1 text-[11px] font-bold text-brand">{task.category}</span><button onClick={close} className="rounded-lg p-2 text-slate-400 transition hover:bg-slate-100 hover:text-slate-700"><Icon name="close"/></button></div><input value={task.name} onChange={e => updateTask(task.id, {name: e.target.value})} className="w-full border-b border-transparent bg-transparent pb-2 text-2xl font-extrabold tracking-tight outline-none transition focus:border-brand"/><div className="mt-5 flex gap-2"><Badge priority={task.priority}/><span className="rounded-full bg-slate-100 px-2.5 py-1 text-[11px] font-bold text-slate-500">Due {task.due}</span></div><div className="mt-8"><h4 className="text-sm font-extrabold">Description</h4><textarea value={task.description} onChange={e => updateTask(task.id, {description: e.target.value})} className="mt-3 h-28 w-full resize-none rounded-xl bg-slate-50 p-3 text-sm leading-relaxed text-slate-600 outline-none ring-brand transition focus:ring-2" placeholder="Add a note to this task..."/></div><div className="mt-8"><div className="flex items-center justify-between"><h4 className="text-sm font-extrabold">Subtasks</h4><span className="text-xs font-bold text-slate-400">{task.subtasks.filter(s => s.done).length}/{task.subtasks.length}</span></div><div className="mt-3 space-y-2">{task.subtasks.map(item => <button key={item.id} onClick={() => toggleSubtask(item.id)} className="flex w-full items-center gap-3 rounded-xl p-2 text-left text-sm hover:bg-slate-50"><span className={'grid h-5 w-5 shrink-0 place-items-center rounded-md border ' + (item.done ? 'border-brand bg-brand text-white' : 'border-slate-300 text-transparent')}><Icon name="check" size={13} stroke={3}/></span><span className={item.done ? 'text-slate-400 line-through' : 'font-medium text-slate-600'}>{item.title}</span></button>)}</div><form onSubmit={addSubtask} className="mt-3 flex gap-2"><input value={subtask} onChange={e => setSubtask(e.target.value)} className="min-w-0 flex-1 rounded-lg bg-slate-50 px-3 py-2 text-xs outline-none ring-brand focus:ring-2" placeholder="Add subtask"/><button className="rounded-lg bg-indigo-50 px-3 text-brand"><Icon name="plus" size={16}/></button></form></div><button onClick={() => updateTask(task.id, {done: !task.done})} className={'mt-8 flex w-full items-center justify-center gap-2 rounded-xl py-3 text-sm font-bold transition ' + (task.done ? 'bg-slate-100 text-slate-500' : 'bg-brand text-white shadow-lg shadow-indigo-200')}><Icon name="check" size={17}/>{task.done ? 'Marked complete' : 'Mark as complete'}</button><button onClick={() => { if (window.confirm(`Delete “${task.name}”? This cannot be undone.`)) deleteTask(task); }} className="mt-3 flex w-full items-center justify-center gap-2 rounded-xl border border-rose-200 py-3 text-sm font-bold text-rose-600 transition hover:bg-rose-50"><Icon name="close" size={16}/>Delete task</button></aside></>;
      }
      function RoutinePanel({ entry, close, saveRoutine }) {
        const [item, setItem] = useState(entry.item);
        const change = (field, value) => setItem(current => ({ ...current, [field]: value }));
        const submit = event => { event.preventDefault(); if (!item.title.trim()) return; saveRoutine(entry.day, { ...item, title: item.title.trim() }, entry.isNew); close(); };
        return <><div onClick={close} className="fixed inset-0 z-30 bg-slate-900/20 backdrop-blur-[1px]"/><aside className="scrollbar-thin fixed inset-y-0 right-0 z-40 w-full max-w-[390px] overflow-y-auto bg-white p-6 shadow-2xl"><form onSubmit={submit}><div className="mb-7 flex items-center justify-between"><span className="rounded-full bg-indigo-50 px-2.5 py-1 text-[11px] font-bold text-brand">{dayLong[entry.day]}</span><button type="button" onClick={close} aria-label="Close routine panel" className="rounded-lg p-2 text-slate-400 transition hover:bg-slate-100 hover:text-slate-700"><Icon name="close"/></button></div><p className="text-xs font-bold uppercase tracking-wider text-slate-400">Weekly routine</p><input autoFocus value={item.title} onChange={event => change('title', event.target.value)} className="mt-2 w-full border-b border-transparent bg-transparent pb-2 text-2xl font-extrabold tracking-tight outline-none transition focus:border-brand" placeholder="Routine title"/><div className="mt-7"><label className="text-sm font-extrabold">Details</label><textarea value={item.details} onChange={event => change('details', event.target.value)} className="mt-3 h-32 w-full resize-none rounded-xl bg-slate-50 p-3 text-sm leading-relaxed text-slate-600 outline-none ring-brand transition focus:ring-2" placeholder="Add helpful details, a time, or a note..."/></div><button type="button" onClick={() => change('done', !item.done)} className="mt-6 flex w-full items-center gap-3 rounded-xl bg-slate-50 p-3 text-left"><span className={'grid h-5 w-5 place-items-center rounded-md border ' + (item.done ? 'border-brand bg-brand text-white' : 'border-slate-300 text-transparent')}><Icon name="check" size={13} stroke={3}/></span><span className="text-sm font-bold">{item.done ? 'Completed' : 'Mark as complete'}</span></button><button className="mt-6 flex w-full items-center justify-center gap-2 rounded-xl bg-brand py-3 text-sm font-bold text-white shadow-lg shadow-indigo-200"><Icon name="check" size={17}/>{entry.isNew ? 'Add routine' : 'Save changes'}</button></form></aside></>;
      }
      function AuthModal({ close, authenticate, error }) {
        const [mode, setMode] = useState('login');
        const [username, setUsername] = useState('');
        const [email, setEmail] = useState('');
        const [password, setPassword] = useState('');
        const submit = event => { event.preventDefault(); authenticate(mode, email.trim(), password, username); };
        return <div className="fixed inset-0 z-50 grid place-items-center bg-slate-900/40 p-4"><form onSubmit={submit} className="w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl"><div className="mb-6 flex items-center justify-between"><div><p className="text-xs font-bold uppercase tracking-[.16em] text-brand">Easylife Planner</p><h3 className="mt-1 text-xl font-extrabold">{mode === 'login' ? 'Welcome back' : 'Create your account'}</h3></div><button type="button" onClick={close} aria-label="Close login" className="rounded-lg p-2 text-slate-400 transition hover:bg-slate-100"><Icon name="close"/></button></div><p className="mb-5 text-sm text-slate-500">{mode === 'login' ? 'Log in to sync your planner across devices.' : 'Your tasks and routines will be stored securely in your account.'}</p>{error && <p className="mb-4 rounded-xl bg-rose-50 p-3 text-xs font-semibold text-rose-600">{error}</p>}{mode === 'signup' && <label className="mb-4 block text-xs font-bold text-slate-500">Username<input autoFocus required value={username} onChange={event => setUsername(event.target.value)} className="mt-1.5 w-full rounded-xl border border-slate-200 bg-transparent px-3 py-2.5 text-sm outline-none focus:border-brand" placeholder="How should we call you?"/></label>}<label className="block text-xs font-bold text-slate-500">Email address<input autoFocus={mode === 'login'} required type="email" value={email} onChange={event => setEmail(event.target.value)} className="mt-1.5 w-full rounded-xl border border-slate-200 bg-transparent px-3 py-2.5 text-sm outline-none focus:border-brand" placeholder="you@example.com"/></label><label className="mt-4 block text-xs font-bold text-slate-500">Password<input required minLength="6" type="password" value={password} onChange={event => setPassword(event.target.value)} className="mt-1.5 w-full rounded-xl border border-slate-200 bg-transparent px-3 py-2.5 text-sm outline-none focus:border-brand" placeholder="At least 6 characters"/></label><button className="mt-6 w-full rounded-xl bg-brand py-3 text-sm font-bold text-white shadow-lg shadow-indigo-200">{mode === 'login' ? 'Log in' : 'Create account'}</button><button type="button" onClick={() => setMode(current => current === 'login' ? 'signup' : 'login')} className="mt-4 w-full text-xs font-bold text-brand">{mode === 'login' ? 'New here? Create an account' : 'Already have an account? Log in'}</button></form></div>;
      }
      function NewTaskModal({ task, setTask, close, save }) { const change = (field, value) => setTask(current => ({...current, [field]: value})); return <div className="fixed inset-0 z-50 grid place-items-center bg-slate-900/30 p-4"><form onSubmit={save} className="w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl"><div className="mb-5 flex items-center justify-between"><h3 className="text-lg font-extrabold">Add a new task</h3><button type="button" onClick={close} className="text-slate-400"><Icon name="close"/></button></div><label className="block text-xs font-bold text-slate-500">Task name<input autoFocus value={task.name} onChange={e => change('name',e.target.value)} className="mt-1.5 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-brand" placeholder="What needs to be done?"/></label><div className="mt-4 grid grid-cols-2 gap-3"><label className="text-xs font-bold text-slate-500">Priority<select value={task.priority} onChange={e => change('priority',e.target.value)} className="mt-1.5 w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm outline-none"><option>High</option><option>Medium</option><option>Low</option></select></label><label className="text-xs font-bold text-slate-500">Due date<input type="date" value={task.due} onChange={e => change('due',e.target.value)} className="mt-1.5 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none"/></label></div><label className="mt-4 block text-xs font-bold text-slate-500">Category<select value={task.category} onChange={e => change('category',e.target.value)} className="mt-1.5 w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm outline-none"><option>Study</option><option>Work</option><option>Personal</option></select></label><button className="mt-6 w-full rounded-xl bg-brand py-3 text-sm font-bold text-white">Create task</button></form></div>; }
      function Calendar({ tasks, setSelectedId, addTaskForDate }) {
        const today = new Date();
        const todayKey = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
        const [month, setMonth] = useState(new Date(today.getFullYear(), today.getMonth(), 1));
        const [selectedDate, setSelectedDate] = useState(todayKey);
        const year = month.getFullYear();
        const monthIndex = month.getMonth();
        const monthLabel = month.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
        const firstDay = (new Date(year, monthIndex, 1).getDay() + 6) % 7;
        const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
        const cells = Array.from({ length: Math.ceil((firstDay + daysInMonth) / 7) * 7 }, (_, index) => index - firstDay + 1);
        const dateKey = date => `${year}-${String(monthIndex + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
        return <section className="rounded-2xl bg-white p-5 shadow-soft sm:p-6"><div className="mb-6 flex flex-col justify-between gap-4 sm:flex-row sm:items-center"><div><h3 className="font-extrabold">{monthLabel}</h3><p className="mt-1 text-xs text-slate-400">Select a day to add a task or review its deadlines.</p></div><div className="flex items-center gap-2"><button onClick={() => setMonth(current => new Date(current.getFullYear(), current.getMonth() - 1, 1))} aria-label="Previous month" className="rounded-lg bg-slate-50 px-3 py-2 text-xs font-bold">‹</button><button onClick={() => { setMonth(new Date(today.getFullYear(), today.getMonth(), 1)); setSelectedDate(todayKey); }} className="rounded-lg bg-slate-50 px-3 py-2 text-xs font-bold">Today</button><button onClick={() => setMonth(current => new Date(current.getFullYear(), current.getMonth() + 1, 1))} aria-label="Next month" className="rounded-lg bg-slate-50 px-3 py-2 text-xs font-bold">›</button><button onClick={() => addTaskForDate(selectedDate)} className="ml-1 flex items-center gap-1 rounded-lg bg-brand px-3 py-2 text-xs font-bold text-white"><Icon name="plus" size={14}/> Add task</button></div></div><div className="grid grid-cols-7 border-l border-t border-slate-100">{days.map(day => <div key={day} className="border-b border-r border-slate-100 p-2 text-center text-[11px] font-bold text-slate-400">{day}</div>)}{cells.map((date, index) => { const outsideMonth = date < 1 || date > daysInMonth; const key = outsideMonth ? null : dateKey(date); const taskItems = key ? tasks.filter(task => task.due === key) : []; const selected = key === selectedDate; const isToday = key === todayKey; return <div key={index} onClick={() => key && setSelectedDate(key)} className={'min-h-[110px] border-b border-r border-slate-100 p-2 transition ' + (outsideMonth ? 'bg-slate-50/60' : selected ? 'bg-indigo-50/60 ring-1 ring-inset ring-indigo-200' : 'cursor-pointer hover:bg-slate-50')}>{!outsideMonth && <><div className="flex items-center justify-between"><span className={'grid h-6 w-6 place-items-center rounded-full text-xs font-bold ' + (isToday ? 'bg-brand text-white' : '')}>{date}</span>{taskItems.length > 0 && <span className="text-[10px] font-bold text-slate-400">{taskItems.length}</span>}</div><div className="mt-2 space-y-1">{taskItems.map(task => <button onClick={event => { event.stopPropagation(); setSelectedId(task.id); }} key={task.id} className={'block w-full truncate rounded px-1.5 py-1 text-left text-[10px] font-bold ' + (task.done ? 'bg-emerald-50 text-emerald-500 line-through' : task.priority === 'High' ? 'bg-rose-50 text-rose-500' : 'bg-indigo-50 text-brand')}>{task.name}</button>)}</div>{selected && <button onClick={event => { event.stopPropagation(); addTaskForDate(key); }} className="mt-2 flex items-center gap-1 text-[10px] font-bold text-brand"><Icon name="plus" size={12}/> Add task</button>}</>}</div>})}</div></section>;
      }
      function Statistics({ tasks, routine }) {
        const completed = tasks.filter(task => task.done).length;
        const routineItems = Object.values(routine).flat();
        const totalRoutine = routineItems.length;
        const completedRoutine = routineItems.filter(item => item.done).length;
        const routineRate = totalRoutine ? Math.round(completedRoutine / totalRoutine * 100) : 0;
        const taskRate = tasks.length ? Math.round(completed / tasks.length * 100) : 0;
        const priority = ['High','Medium','Low'].map(level => ({ level, count: tasks.filter(task => task.priority === level).length, color: level === 'High' ? 'bg-rose-400' : level === 'Medium' ? 'bg-amber-400' : 'bg-emerald-400' }));
        return <div className="grid gap-6 xl:grid-cols-5">
          <section className="rounded-2xl bg-white p-6 shadow-soft xl:col-span-3"><div className="flex items-start justify-between"><div><h3 className="font-extrabold">Weekly routine progress</h3><p className="mt-1 text-xs text-slate-400">Completed routine items by day</p></div><span className="rounded-full bg-indigo-50 px-2.5 py-1 text-xs font-bold text-brand">{completedRoutine}/{totalRoutine}</span></div><div className="mt-8 flex h-52 items-end justify-between gap-3">{days.map(day => { const total = routine[day].length; const done = routine[day].filter(item => item.done).length; const value = total ? Math.max(12, Math.round(done / total * 164)) : 8; return <div className="flex flex-1 flex-col items-center gap-2" key={day}><div title={`${done} of ${total} complete`} className="w-full max-w-10 rounded-t-lg bg-brand/90 transition hover:bg-brand" style={{height: value + 'px'}}></div><span className="text-[11px] font-bold text-slate-400">{day}</span></div> })}</div></section>
          <section className="rounded-2xl bg-gradient-to-br from-indigo-500 to-brand p-6 text-white shadow-lg shadow-indigo-100 xl:col-span-2"><p className="text-sm font-bold text-indigo-100">Routine completion</p><p className="mt-3 text-5xl font-extrabold">{routineRate}%</p><p className="mt-2 text-sm text-indigo-100">{completedRoutine} of {totalRoutine} routine items completed</p><div className="mt-7 h-2 overflow-hidden rounded-full bg-white/25"><div className="h-full rounded-full bg-white" style={{width: routineRate + '%'}}/></div><p className="mt-7 text-xs leading-relaxed text-indigo-100">Check off each routine item to build a clear picture of your weekly consistency.</p></section>
          <section className="rounded-2xl bg-white p-6 shadow-soft xl:col-span-2"><h3 className="font-extrabold">Task priorities</h3><div className="mt-7 space-y-5">{priority.map(item => <div key={item.level}><div className="mb-2 flex justify-between text-xs font-bold"><span className="text-slate-500">{item.level}</span><span>{item.count}</span></div><div className="h-2 overflow-hidden rounded-full bg-slate-100"><div className={'h-full rounded-full ' + item.color} style={{width: (tasks.length ? item.count / tasks.length * 100 : 0) + '%'}}/></div></div>)}</div></section>
          <section className="rounded-2xl bg-white p-6 shadow-soft xl:col-span-3"><h3 className="font-extrabold">Weekly overview</h3><div className="mt-5 grid gap-3 sm:grid-cols-2"><div className="rounded-xl bg-indigo-50 p-5"><p className="text-xs font-bold uppercase tracking-wide text-brand">Tasks completed</p><p className="mt-2 text-3xl font-extrabold">{taskRate}%</p><p className="mt-1 text-xs text-slate-500">{completed} of {tasks.length} tasks finished</p></div><div className="rounded-xl bg-emerald-50 p-5"><p className="text-xs font-bold uppercase tracking-wide text-emerald-600">Routine streak</p><p className="mt-2 text-3xl font-extrabold">{completedRoutine}</p><p className="mt-1 text-xs text-slate-500">routine items checked off this week</p></div></div></section>
        </div>;
      }
      function Settings({ darkMode, setDarkMode, user, displayName, avatarLetter }) { return <div className="max-w-2xl space-y-6"><section className="rounded-2xl bg-white p-6 shadow-soft"><h3 className="font-extrabold">Profile</h3><div className="mt-5 flex items-center gap-4"><div className="grid h-14 w-14 place-items-center rounded-full bg-orange-100 text-lg font-bold text-orange-600">{avatarLetter}</div><div><p className="font-bold">{displayName}</p><p className="text-sm text-slate-400">{user?.email || 'Sign in to create your profile'}</p></div></div></section><section className="rounded-2xl bg-white p-6 shadow-soft"><h3 className="font-extrabold">Appearance</h3><p className="mt-1 text-sm text-slate-400">Choose how Easylife Planner looks on this device.</p><button onClick={() => setDarkMode(current => !current)} aria-pressed={darkMode} className="mt-5 flex w-full items-center justify-between rounded-xl bg-slate-50 p-4 text-left"><span><span className="block text-sm font-bold">Dark mode</span><span className="mt-1 block text-xs text-slate-400">{darkMode ? 'Easier on the eyes in low light' : 'Use a darker color palette'}</span></span><span className={'relative h-6 w-11 rounded-full transition ' + (darkMode ? 'bg-brand' : 'bg-slate-300')}><span className={'absolute top-1 h-4 w-4 rounded-full bg-white shadow transition ' + (darkMode ? 'left-6' : 'left-1')}/></span></button></section><section className="rounded-2xl bg-white p-6 shadow-soft"><h3 className="font-extrabold">Notifications</h3><p className="mt-1 text-sm text-slate-400">Notification connections will be available when the online backend is added.</p><div className="mt-5 space-y-3"><Toggle label="Email reminders" detail="Receive a reminder before your task is due" checked/><Toggle label="Discord alerts" detail="Send a deadline alert to your Discord channel"/></div></section><section className="rounded-2xl border border-dashed border-indigo-200 bg-indigo-50 p-6"><h3 className="font-extrabold text-brand">Cloud sync is ready</h3><p className="mt-2 text-sm leading-relaxed text-slate-500">Sign in to keep your tasks, routines, and progress safely stored in your account.</p></section></div>; }
      function Toggle({label, detail, checked}) { const [on, setOn] = useState(checked); return <button onClick={() => setOn(!on)} className="flex w-full items-center justify-between rounded-xl bg-slate-50 p-4 text-left"><span><span className="block text-sm font-bold">{label}</span><span className="mt-1 block text-xs text-slate-400">{detail}</span></span><span className={'relative h-6 w-11 rounded-full transition ' + (on ? 'bg-brand' : 'bg-slate-300')}><span className={'absolute top-1 h-4 w-4 rounded-full bg-white shadow transition ' + (on ? 'left-6' : 'left-1')}/></span></button>; }
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
